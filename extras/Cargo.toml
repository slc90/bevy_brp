[package]
authors.workspace = true
categories = [
  "development-tools",
  "development-tools::debugging",
  "game-development",
]
description = "Extra BRP methods for Bevy apps including screenshot, shutdown, and keyboard input capabilities"
edition.workspace = true
keywords = ["bevy", "brp", "debugging", "gamedev", "remote"]
license.workspace = true
name = "bevy_brp_extras"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace    = true
publish              = false

[dependencies]
# Minimal Bevy features for extras library:
# - bevy_render: Screenshot/ScreenshotCaptured (transitively enables bevy_window, bevy_camera, bevy_image)
# - bevy_log: info!/warn!/error! macros in bevy::prelude
# - serialize: Serialize/Deserialize impls on bevy input types (MouseButton, MouseScrollUnit, etc.)
# - png: screenshot PNG support and ImageFormat::from_extension("png") check
bevy = { workspace = true, features = [
  "bevy_log",
  "bevy_render",
  "png",
  "serialize",
] }

bevy_remote = { workspace = true, default-features = true }
image.workspace = true
tempfile.workspace = true

schemars.workspace     = true
serde.workspace        = true
serde_json.workspace   = true
strum.workspace        = true
strum_macros.workspace = true

[features]
default     = ["diagnostics", "ui"]
diagnostics = []
ui          = ["bevy/bevy_ui"]

[dev-dependencies]
async-channel.workspace = true
reqwest.workspace       = true

[lints]
workspace = true
