[workspace]
members = [
  "crates/extras",
  "crates/mcp",
  "crates/mcp_macros",
  "crates/runtime",
  "tests/test-app",
  "tests/test-duplicate-a",
  "tests/test-duplicate-b",
]
resolver = "3"

[workspace.package]
authors = ["natepiano <slicks.curable.0k@icloud.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slc90/bevy_brp"
rust-version = "1.98.1"
version = "0.2.2"

[workspace.dependencies]
# Bevy with no default features - each crate specifies what it needs
bevy            = { version = "0.19.1", default-features = false }
bevy_brp_extras = { version = "0.2.2", path = "crates/extras" }
bevy_brp_runtime = { version = "0.2.2", path = "crates/runtime" }
bevy_mesh       = { version = "0.19.1" }
bevy_remote     = { version = "0.19.1", default-features = false }
bevy_winit      = { version = "0.19.1" }

# Core dependencies (shared between extras and mcp)
anyhow = "1.0"
async-channel = "2.5.0"
async-io = "2.6.0"
async-trait = "0.1.92"
bevy_brp_mcp_macros = { version = "0.2.2", path = "crates/mcp_macros" }
cargo_metadata = "0.23"
chrono = "0.4"
either = "1.18.0"
error-stack = { version = "0.8.0", features = ["spantrace"] }
futures = "0.3"
futures-util = "0.3.34"
heck = "0.5.0"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
itertools = "0.15.0"
json-pretty-compact = "0.1.2"
netstat2 = "0.11"
nom = "8.0.0"
once_cell = "1.21.4"
paste = "1.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "stream"] }
rmcp = { version = "3.3.0", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smol-hyper = "0.1.1"
strum = "0.28.0"
strum_macros = "0.28.0"
syn = { version = "3.0.5", features = ["extra-traits", "full"] }
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full", "signal"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = { version = "0.1.44", features = [
  "max_level_trace",
  "release_max_level_trace",
] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
