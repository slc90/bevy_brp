[package]
authors = ["natepiano <slicks.curable.0k@icloud.com>"]
categories = [
  "development-tools",
  "development-tools::debugging",
  "game-development",
]
description = "Wake-aware BRP runtime transport and progress controller for Bevy applications"
edition = "2024"
keywords = ["bevy", "brp", "debugging", "gamedev", "remote"]
license = "MIT OR Apache-2.0"
name = "bevy_brp_runtime"
repository.workspace = true
version.workspace    = true
publish              = false

[dependencies]
async-channel.workspace = true
async-io.workspace      = true
bevy = { workspace = true, features = [
  "bevy_log",
  "bevy_render",
  "bevy_winit",
] }
bevy_brp_extras.workspace = true
bevy_remote.workspace     = true
futures-util.workspace    = true
http-body-util.workspace  = true
hyper.workspace           = true
serde_json.workspace      = true
smol-hyper.workspace      = true

[lints]
workspace = true
